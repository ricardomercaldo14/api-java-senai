<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Professores</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #34495e;
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: #3498db;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary { background: #27ae60; color: #fff; }
        .btn-primary:hover { background: #219150; }

        .btn-cancel { background: #7f8c8d; color: #fff; display: none; }
        .btn-cancel:hover { background: #6c7a7d; }

        .btn-edit { background: #f39c12; color: #fff; margin-right: 5px; }
        .btn-edit:hover { background: #d68910; }

        .btn-delete { background: #e74c3c; color: #fff; }
        .btn-delete:hover { background: #c0392b; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #34495e;
            color: #fff;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestão de Professores</h1>

    <div id="mensagem" class="alert"></div>

    <!-- Form -->
    <div class="card">
        <h2 id="form-title">Cadastrar Novo Professor</h2>
        <form id="professor-form">
            <input type="hidden" id="professor-id">

            <div class="form-group">
                <input type="text" id="nome" placeholder="Nome Completo" required>
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="text" id="cpf" placeholder="CPF" required>
            </div>

            <div class="btn-group">
                <button type="submit" id="btn-salvar" class="btn-primary">Cadastrar</button>
                <button type="button" id="btn-cancelar" class="btn-cancel" onclick="limparFormulario()">Cancelar</button>
            </div>
        </form>
    </div>

    <!-- Tabela -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>CPF</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody id="tabela-corpo">
        <!-- Os dados da API serão inseridos aqui -->
        </tbody>
    </table>
</div>

<script>
    const API_URL = "http://localhost:8080/professor";

    document.addEventListener("DOMContentLoaded", carregarProfessores);
    document.getElementById("professor-form").addEventListener("submit", salvarProfessor);

    // Listar todos os professores (GET /listar)
    async function carregarProfessores() {
        try {
            const res = await fetch(`${API_URL}/listar`);
            const professores = await res.json();

            const tbody = document.getElementById("tabela-corpo");
            tbody.innerHTML = "";

            if (professores.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Nenhum professor cadastrado.</td></tr>`;
                return;
            }

            professores.forEach(prof => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${prof.idProfessor}</td>
                    <td>${prof.nome}</td>
                    <td>${prof.email}</td>
                    <td>${prof.cpf}</td>
                    <td>
                        <button class="btn-edit" onclick="prepararEdicao(${prof.idProfessor}, '${prof.nome}', '${prof.email}', '${prof.cpf}')">Editar</button>
                        <button class="btn-delete" onclick="deletarProfessor(${prof.idProfessor})">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            exibirMensagem("Erro ao carregar a lista de professores.", "error");
        }
    }

    // Salvar ou Atualizar (POST /cadastrar ou PUT /{id})
    async function salvarProfessor(e) {
        e.preventDefault();

        const id = document.getElementById("professor-id").value;
        const nome = document.getElementById("nome").value;
        const email = document.getElementById("email").value;
        const cpf = document.getElementById("cpf").value;

        const professorData = { nome, email, cpf };

        const isEdicao = Boolean(id);
        const url = isEdicao ? `${API_URL}/${id}` : `${API_URL}/cadastrar`;
        const method = isEdicao ? "PUT" : "POST";

        try {
            const res = await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(professorData)
            });

            if (res.ok) {
                exibirMensagem(`Professor ${isEdicao ? 'atualizado' : 'cadastrado'} com sucesso!`, "success");
                limparFormulario();
                carregarProfessores();
            } else {
                const erro = await res.json();
                exibirMensagem(erro.mensagem || "Erro ao salvar professor.", "error");
            }
        } catch (error) {
            exibirMensagem("Erro de conexão com o servidor.", "error");
        }
    }

    // Deletar Professor (DELETE /{id})
    async function deletarProfessor(id) {
        if (!confirm("Tem certeza que deseja excluir este professor?")) return;

        try {
            const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
            const data = await res.json();

            if (res.ok) {
                exibirMensagem(data.mensagem, "success");
                carregarProfessores();
            } else {
                exibirMensagem(data.mensagem || "Erro ao excluir professor.", "error");
            }
        } catch (error) {
            exibirMensagem("Erro ao conectar com o servidor.", "error");
        }
    }

    // Preencher formulário para edição
    function prepararEdicao(id, nome, email, cpf) {
        document.getElementById("professor-id").value = id;
        document.getElementById("nome").value = nome;
        document.getElementById("email").value = email;
        document.getElementById("cpf").value = cpf;

        document.getElementById("form-title").innerText = "Editar Professor";
        document.getElementById("btn-salvar").innerText = "Atualizar";
        document.getElementById("btn-cancelar").style.display = "inline-block";
    }

    // Resetar formulário
    function limparFormulario() {
        document.getElementById("professor-id").value = "";
        document.getElementById("professor-form").reset();

        document.getElementById("form-title").innerText = "Cadastrar Novo Professor";
        document.getElementById("btn-salvar").innerText = "Cadastrar";
        document.getElementById("btn-cancelar").style.display = "none";
    }

    // Exibir mensagens de feedback
    function exibirMensagem(msg, tipo) {
        const div = document.getElementById("mensagem");
        div.innerText = msg;
        div.className = `alert alert-${tipo}`;
        div.style.display = "block";

        setTimeout(() => {
            div.style.display = "none";
        }, 3000);
    }
</script>

</body>
</html>
